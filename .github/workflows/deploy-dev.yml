name: Deploy to AWS Development (Zero Downtime)

on:
  pull_request:
    branches:
      - development

env:
  DOCKER_IMAGE_NAME: di

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=sha,prefix=dev-

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS EC2 (Blue-Green)
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: ${{ secrets.AWS_EC2_PORT || 22 }}
          script: |
            set -e

            cd ${{ secrets.DEPLOY_PATH }}

            IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:dev-${{ github.sha }}

            echo "Pulling image: $IMAGE"
            docker pull $IMAGE

            # Determine active color
            if docker ps --format '{{.Names}}' | grep -q app_blue; then
              ACTIVE=blue
              NEXT=green
            else
              ACTIVE=green
              NEXT=blue
            fi

            echo "Active: $ACTIVE, Deploying: $NEXT"

            # Start new version
            IMAGE=$IMAGE docker compose up -d app_$NEXT

            echo "Waiting for health check..."
            sleep 15

            # Switch nginx traffic
            sudo ln -sf /etc/nginx/sites-available/app_$NEXT.conf /etc/nginx/sites-enabled/app.conf
            sudo nginx -s reload

            # Stop old container
            docker compose stop app_$ACTIVE
            docker compose rm -f app_$ACTIVE

            # Cleanup
            docker image prune -af

            docker ps
